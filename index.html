    /* Sismo hover animation for microinteractions */
    @keyframes pbEarthquake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-1px, 1px) rotate(-0.5deg); }
      40% { transform: translate(1px, -1px) rotate(0.5deg); }
      60% { transform: translate(-1px, -1px) rotate(-0.5deg); }
      80% { transform: translate(1px, 1px) rotate(0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* Central Quadrilateral Container */
    .pb-quadrilateral {

      max-width: 450px;
      aspect-ratio: 3 / 4;
      background-color: var(--pb-white);
      position: relative;
      overflow: hidden;
      margin: auto;

      top: -3px;

      width: calc(100% + 6px);
      height: calc(100% + 6px);
      pointer-events: none;

      filter: url(#pb-sketch-filter);

    .pb-carousel-wrapper {

    /* Slide management */
    .pb-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      z-index: 1;

    .pb-slide.pb-active {

      z-index: 2;

  <script>
    class PortfolioCarousel {
      constructor(containerId, intervalTime = 2800) {
        this.container = document.getElementById(containerId);
        if (!this.container) return;

        this.slides = this.container.querySelectorAll('.pb-slide');
        this.totalSlides = this.slides.length;
        this.currentIndex = 0;
        this.intervalTime = intervalTime;
        this.timer = null;
        this.isPaused = false;
        this.hasTrackedHold = false;

        this.init();
      }

      init() {
        this.startTimer();
        this.bindEvents();
      }

      startTimer() {
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
          if (!this.isPaused) {
            this.nextSlide();
          }
        }, this.intervalTime);
      }

      nextSlide() {
        this.slides[this.currentIndex].classList.remove('pb-active');
        this.currentIndex = (this.currentIndex + 1) % this.totalSlides;
        this.slides[this.currentIndex].classList.add('pb-active');
        this.hasTrackedHold = false; // Reset tracking flag for the new slide view
      }

      pause() {
        this.isPaused = true;
        this.container.classList.add('pb-paused');

        // Push hold tracking event to Google Tag Manager once per slide view
        if (!this.hasTrackedHold) {
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event: 'carousel_hold',
            slide_index: this.currentIndex
          });
          this.hasTrackedHold = true;
        }
      }

      resume() {
        this.isPaused = false;
        this.container.classList.remove('pb-paused');
        this.hasTrackedHold = false;
      }

      bindEvents() {
        // Desktop interactions: Hover triggers pause and overlays
        this.container.addEventListener('mouseenter', () => this.pause());
        this.container.addEventListener('mouseleave', () => this.resume());

        // Mobile touch interaction: Passive listener without blocking scrolling vertical gestures
        this.container.addEventListener('touchstart', () => {
          this.pause();
        }, { passive: true });

        this.container.addEventListener('touchend', () => {
          this.resume();
        }, { passive: true });

        this.container.addEventListener('touchcancel', () => {
          this.resume();
        }, { passive: true });

        // GTM Contact Click Tracker
        const contactBtn = document.getElementById('pb-nav-contact');
        if (contactBtn) {
          contactBtn.addEventListener('click', () => {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
              event: 'click_contact',
              location: 'corner_nav'
            });
          });
        }
      }
    }

    // Instantiating custom carousel safe in scope
    document.addEventListener('DOMContentLoaded', () => {
      new PortfolioCarousel('pb-carousel', 2800);
    });
  </script>
